name: Pipeline CI/CD TechStore - Qualidade e Segurança

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  issues: write

jobs:
  # 1. VERIFICAÇÃO DE QUALIDADE
  quality-check:
    name: 1. Verificação de Qualidade (Linting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Sintaxe e Qualidade do HTML (HTMLHint)
        run: |
          npm install -g htmlhint
          htmlhint *.html

  # 2. VERIFICAÇÃO DE SEGURANÇA - SAST
  sast-security:
    name: 2. Análise de Segurança Estática (SAST)
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Análise estática do código (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1' # Interrompe o processo se encontrar falhas críticas
          severity: 'CRITICAL,HIGH'

  # DEPLOY TEMPORÁRIO PARA VIABILIZAR O DAST
  deploy:
    name: Deploy para GitHub Pages
    runs-on: ubuntu-latest
    needs: sast-security
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

  # 3. VERIFICAÇÃO DE SEGURANÇA - DAST
  dast-security:
    name: 3. Análise de Segurança Dinâmica (DAST)
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Aguardar publicação do GitHub Pages
        run: sleep 30

      - name: Varredura Dinâmica no Site Ativo (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://MateusWashington.github.io/Pipeline_CI-CD_Techstore/'
          fail_action: false
          artifact_name: 'zap-scan-report'