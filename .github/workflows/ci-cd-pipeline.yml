name: Pipeline CI/CD TechStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validação e Testes de Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Sintaxe HTML (HTMLHint)
        run: |
          npm install -g htmlhint
          htmlhint *.html

  security-scan:
    name: Análise de Segurança (SAST)
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Análise estática de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Disponibilização do Resultado (GitHub Pages)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .