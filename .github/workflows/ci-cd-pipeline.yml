name: CI/CD Pipeline DevSecOps

on:
  push:
    branches: [ "main", "master", "testes" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. VERIFICAÇÃO DE QUALIDADE - LINTING
  qualidade-check:
    name: 1. Verificação de Qualidade (HTMLHint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Linter HTMLHint
        run: npx htmlhint *.html

  # 2. VERIFICAÇÃO DE SEGURANÇA ESTÁTICA - SAST
  sast-security:
    name: 2. Análise SAST (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Varredura de Vulnerabilidades no Código
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'

  # 3. VERIFICAÇÃO DE SEGREDOS - SECRET SCANNING
  secret-scanning:
    name: 3. Verificação de Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante a leitura do histórico de commits

      - name: Executar Varredura de Secrets com Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. DEPLOY
  deploy:
    name: 4. Deploy no GitHub Pages
    runs-on: ubuntu-latest
    needs: [qualidade-check, sast-security, secret-scanning]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para o GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

  # 5. VERIFICAÇÃO DE SEGURANÇA DINÂMICA - DAST
  dast-security:
    name: 5. Análise DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Aguardar publicação do GitHub Pages
        run: sleep 30

      - name: Varredura Dinâmica no Site Ativo (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://MateusWashington.github.io/Pipeline_CI-CD_Techstore/'
          fail_action: false
          artifact_name: 'zap-scan-report'