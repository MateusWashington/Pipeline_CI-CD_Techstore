name: Pipeline CI/CD TechStore - Qualidade e Segurança

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  issues: write

jobs:
  # 1. VERIFICAÇÃO DE QUALIDADE
  quality-check:
    name: 1. Verificação de Qualidade (Linting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Sintaxe e Qualidade do HTML (HTMLHint)
        run: |
          npm install -g htmlhint
          htmlhint *.html

  # 2. VERIFICAÇÃO DE SEGURANÇA - SAST (Trivy)
  sast-security:
    name: 2. Análise de Segurança Estática (Trivy)
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Análise estática do código (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # 2b. VERIFICAÇÃO DE SEGURANÇA - SAST (Semgrep) - (`p/security-audit`)
  semgrep-security:
    name: 2b. Análise de Segurança Estática (Semgrep)
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Rodar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/security-audit'

  # 3. VERIFICAÇÃO DE SEGREDOS - SECRET SCANNING
  secret-scanning:
    name: 3. Verificação de Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante a leitura do histórico de commits


      - name: Executar Varredura de Secrets com Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       

  # DEPLOY TEMPORÁRIO PARA VIABILIZAR O DAST
  deploy:
    name: Deploy para GitHub Pages
    runs-on: ubuntu-latest
    needs: [sast-security, semgrep-security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

  # 4. VERIFICAÇÃO DE SEGURANÇA - DAST
  dast-security:
    name: 3. Análise de Segurança Dinâmica (DAST)
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Aguardar publicação do GitHub Pages
        run: sleep 30

      - name: Varredura Dinâmica no Site Ativo (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://MateusWashington.github.io/Pipeline_CI-CD_Techstore/'
          fail_action: false
          artifact_name: 'zap-scan-report'




# ADIÇÃO DE STEP HEITOR =================================

  # 2.1 SAST - SEMGREP - (regras `p/default` e `p/javascript`)
  sast-semgrep:
    name: 2.1 Análise Estática Complementar (Semgrep)
    runs-on: ubuntu-latest
    needs: quality-check
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Semgrep
        run: semgrep scan --config p/default --config p/javascript --error --sarif --output semgrep-report.sarif .

      - name: Salvar relatório do Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.sarif

  # 3.1 DAST COMPLEMENTAR - NUCLEI
  dast-nuclei:
    name: 3.1 Análise Dinâmica Complementar (Nuclei)
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Aguardar publicação do GitHub Pages
        run: sleep 30

      - name: Varredura com Nuclei
        run: |
          docker run --rm -v ${{ github.workspace }}:/output projectdiscovery/nuclei:latest \
            -u https://MateusWashington.github.io/Pipeline_CI-CD_Techstore/ \
            -severity low,medium,high,critical \
            -jsonl -o /output/nuclei-report.jsonl

      - name: Salvar relatório do Nuclei
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: nuclei-report.jsonl
          if-no-files-found: ignore
